# Stage 5: hybrid-rrf-k10 with each chunk's title, source and date also in the BM25 index.
# Differs from configs/stage03_chunking/recursive-128.yaml in the retriever only, and
# ranks the chunks of the index that config built.
name: retr-hybrid-rrf-k10-header
index_dir: data/index/chunk-recursive-128

chunker:
  name: recursive
  params: {size: 128}

embedder:
  name: openai
  params: {model: text-embedding-3-small}

store:
  name: numpy

# A second variable on top of hybrid-rrf-k10.yaml: what BM25 indexes. The dense index
# and the text returned are unchanged.
retriever:
  name: hybrid
  params:
    depth: 200
    sparse: {stopwords: true, stemmer: porter, k1: 0.8, b: 1.0, header: true}
    fusion: {method: rrf, k: 10}

top_k: 5

# Question vectors already computed, so a repeat costs nothing and gives the same list.
embedding_cache: data/cache/embeddings.sqlite

generator:
  name: anthropic
  params: {model: claude-sonnet-5-5, max_tokens: 4096, effort: low}
