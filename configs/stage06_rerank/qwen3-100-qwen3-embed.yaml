# Stage 6: Qwen3-Reranker-0.6B (2025, 0.6B parameters, 1.2 GB), a language model scored on yes against no, run locally.
# A second variable on top of qwen3-100.yaml: the dense half of the hybrid uses
# Qwen3-Embedding-0.6B (configs/stage04_embedding/qwen3.yaml) and not
# text-embedding-3-small. Stage 4 found Qwen3 better only in the order of the top 10. It
# asks whether that still matters once a reranker reorders the list.
name: rerank-qwen3-100-qwen3-embed
index_dir: data/index/embed-qwen3

chunker:
  name: recursive
  params: {size: 128}

embedder:
  name: local
  params:
    model: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    query_prefix: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"

store:
  name: numpy

retriever:
  name: hybrid
  params:
    depth: 200
    sparse: {stopwords: true, stemmer: porter, k1: 0.8, b: 1.0}
    fusion: {method: rrf, k: 60}

# The evaluator scores 50 chunks. A depth of 100 can bring chunks the retriever ranked
# 51 to 100 into them, so recall@50 can change.
reranker:
  name: cross_encoder
  params:
    model: Qwen/Qwen3-Reranker-0.6B
    revision: e61197ed45024b0ed8a2d74b80b4d909f1255473
    scoring: yes_no
    depth: 100
    # A question is about 54 tokens and a chunk about 92, far under this limit.
    max_length: 512
    batch_size: 32
    # Scores already computed. One pass at depth 100 also serves 20 and 50.
    cache: data/cache/rerank.sqlite

top_k: 5

# Question vectors already computed, so a repeat costs nothing and gives the same list.
embedding_cache: data/cache/embeddings.sqlite

generator:
  name: anthropic
  params: {model: claude-sonnet-5-5, max_tokens: 4096, effort: low}
