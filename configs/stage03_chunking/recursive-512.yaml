# Stage 3: recursive splitting (paragraph, line, sentence, word) at 512 tokens.
# Differs from configs/baseline.yaml in the chunker only.
name: chunk-recursive-512
index_dir: data/index/chunk-recursive-512

chunker:
  name: recursive
  params: {size: 512}

embedder:
  name: openai
  params: {model: text-embedding-3-small}

store:
  name: numpy

top_k: 5

generator:
  name: anthropic
  params: {model: claude-sonnet-5-5, max_tokens: 4096, effort: low}
