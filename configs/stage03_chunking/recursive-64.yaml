# Stage 3: recursive splitting at 64 tokens, one step below the planned sizes.
# Differs from configs/baseline.yaml in the chunker only.
name: chunk-recursive-64
index_dir: data/index/chunk-recursive-64

chunker:
  name: recursive
  params: {size: 64}

embedder:
  name: openai
  params: {model: text-embedding-3-small}

store:
  name: numpy

top_k: 5

generator:
  name: anthropic
  params: {model: claude-sonnet-5-5, max_tokens: 4096, effort: low}
