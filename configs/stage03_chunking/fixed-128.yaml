# Stage 3: the baseline's fixed cut, at 128 tokens.
# Differs from configs/baseline.yaml in the chunker only.
name: chunk-fixed-128
index_dir: data/index/chunk-fixed-128

chunker:
  name: fixed
  params: {size: 128}

embedder:
  name: openai
  params: {model: text-embedding-3-small}

store:
  name: numpy

top_k: 5

generator:
  name: anthropic
  params: {model: claude-sonnet-5-5, max_tokens: 4096, effort: low}
