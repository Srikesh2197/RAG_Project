[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbasics"
version = "0.1.0"
description = "A measured, stage-by-stage RAG pipeline built by hand"
readme = "README.md"
requires-python = ">=3.12"
# Each stage adds only the dependencies it needs. Exact versions are in requirements.lock.
dependencies = [
    "anthropic>=1.0",
    "huggingface_hub>=0.25",
    "numpy>=2.0",
    "openai>=2.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.40",
    "tiktoken>=0.8",
]

[project.scripts]
rag = "ragbasics.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Library equivalent of the hand-written retrieval metrics; used by a parity test.
    "ranx>=0.3.20",
    "ruff>=0.6",
]
# Embedding models run on this machine (Stage 4). About 600 MB installed, so it is
# not a base dependency; src/ imports it only when a "local" embedder is first used.
local = [
    "sentence-transformers>=6.1",
    "torch>=2.14",
]
# Library versions of hand-written parts, used only by framework_equivalents/ and its
# parity tests. Nothing in src/ imports them.
frameworks = [
    # Library equivalent of the hand-written BM25 index (Stage 5).
    "bm25s>=0.3",
    "langchain-text-splitters>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
