[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbasics"
version = "0.1.0"
description = "A measured, stage-by-stage RAG pipeline built by hand"
readme = "README.md"
requires-python = ">=3.12"
# Each stage adds only the dependencies it needs. Exact versions are in requirements.lock.
dependencies = [
    "huggingface_hub>=0.25",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
